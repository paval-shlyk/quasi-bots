name: CI

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libsqlite3-dev
      - name: Lint
        run: just lint

  build-deb:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.vars.outputs.release_tag }}
      is_prerelease: ${{ steps.vars.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine Version and Tag
        id: vars
        shell: bash
        run: |
          BASE_VERSION=$(grep '^version =' skill-master/Cargo.toml | cut -d '"' -f 2)
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          
          if [[ "$BRANCH_NAME" == "dev" ]]; then
            SUFFIX="dev"
            RELEASE_TAG="latest-dev"
            IS_PRERELEASE="true"
          else
            SUFFIX="stable"
            RELEASE_TAG="latest-stable"
            IS_PRERELEASE="false"
          fi
          
          FULL_VERSION="${BASE_VERSION}-${SUFFIX}"
          
          echo "Full Version: $FULL_VERSION"
          echo "Release Tag: $RELEASE_TAG"
          
          echo "full_version=${FULL_VERSION}" >> $GITHUB_OUTPUT
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libsqlite3-dev

      - name: Install cargo-chef
        run: cargo install cargo-chef

      - name: Prepare recipe
        run: cargo chef prepare --recipe-path recipe.json

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('recipe.json') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-deb
        run: |
          if ! command -v cargo-deb &> /dev/null; then
            cargo install cargo-deb
          fi

      - name: Cook ingredients
        run: cargo chef cook --release --recipe-path recipe.json

      - name: Build and Package
        run: cargo deb -p skill-master --deb-version ${{ steps.vars.outputs.full_version }}

      - name: Upload Deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-master-deb
          path: target/debian/*.deb

  release:
    needs: build-deb
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: skill-master-deb
          path: artifacts

      - name: Generate Date
        run: echo "DATE=$(date -u)" >> $GITHUB_ENV

      - name: Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build-deb.outputs.release_tag }}
          prerelease: ${{ needs.build-deb.outputs.is_prerelease }}
          files: artifacts/*.deb
          name: ${{ needs.build-deb.outputs.release_tag }}
          body: |
            Rolling release for branch ${{ github.ref_name }}.
            Build Date: ${{ env.DATE }}
