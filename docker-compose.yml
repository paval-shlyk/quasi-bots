services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    # Use host networking so Prometheus can scrape services on localhost
    network_mode: "host"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: crypto
      POSTGRES_DB: crypto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker-grok:
    build: .
    command: ["crypto"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://crypto:crypto@postgres:5432/crypto
      GRPC_ADDR: 0.0.0.0:50051
      WORKER_ID: grok-worker
      LLM_PROVIDER: grok
      BINANCE_API_KEY: ${BINANCE_API_KEY}
      BINANCE_SECRET_KEY: ${BINANCE_SECRET_KEY}
      POLYMARKET_API_KEY: ${POLYMARKET_API_KEY}
      RUST_LOG: info,crypto=debug

  worker-gemini:
    build: .
    command: ["crypto"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://crypto:crypto@postgres:5432/crypto
      GRPC_ADDR: 0.0.0.0:50051
      WORKER_ID: gemini-worker
      LLM_PROVIDER: gemini
      BINANCE_API_KEY: ${BINANCE_API_KEY}
      BINANCE_SECRET_KEY: ${BINANCE_SECRET_KEY}
      POLYMARKET_API_KEY: ${POLYMARKET_API_KEY}
      RUST_LOG: info,crypto=debug

  master:
    build: .
    command: ["crypto-master"]
    restart: unless-stopped
    depends_on:
      - worker-grok
      - worker-gemini
    ports:
      - "50050:50050"
    environment:
      MASTER_GRPC_ADDR: 0.0.0.0:50050
      WORKER_ADDRS: grok-worker=http://worker-grok:50051,gemini-worker=http://worker-gemini:50051
      RUST_LOG: info,crypto_master=debug

volumes:
  pgdata:
