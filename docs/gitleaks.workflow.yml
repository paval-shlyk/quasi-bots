# Optional dedicated gitleaks workflow (covers PRs targeting `dev` as well as `main`).
# Copy to `.github/workflows/gitleaks.yml` with a token that has the GitHub
# `workflow` OAuth scope. Until then, CI relies on `just gitleaks` via the check job.
name: gitleaks

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE only required for GitHub Organizations
