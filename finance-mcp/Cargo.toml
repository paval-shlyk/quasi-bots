[package]
name = "finance-mcp"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
description = "MCP server exposing DZENGI.com exchange API for LLM consumption"

[[bin]]
name = "finance-mcp"
path = "src/main.rs"

[dependencies]
anyhow    = { workspace = true }
axum      = { workspace = true }
serde     = { workspace = true }
tracing   = { workspace = true }
tokio     = { workspace = true, features = [
    "fs",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
] }

rmcp = { version = "1.7", features = [
    "server",
    "macros",
    "schemars",
    "auth",
    "transport-streamable-http-server",
] }

finance      = { version = "0.1.0", path = "../finance" }
clap         = { version = "4.5", features = ["derive"] }
serde_json   = "1.0"
toml         = "0.9"
uuid         = { version = "1", features = ["v4"] }
chrono       = "0.4"
rand         = "0.9"
tower-http   = { version = "0.6", features = ["cors"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package.metadata.deb]
maintainer = "Paval Shlyk <paval.shlyk@quasi.su>"
copyright  = "2026, quasi.su"
depends    = "$auto, podman"
section    = "utility"
assets = [
    ["systemd/finance-mcp.container", "/etc/containers/systemd/finance-mcp.container", "644"],
    ["config.deb.toml",               "/etc/finance-mcp/config.toml",                  "640"],
]
conf-files = ["/etc/finance-mcp/config.toml"]
maintainer-scripts = "debian/"
