[package]
name = "knowledge"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[dependencies]
anyhow = "1.0.101"
axum = "0.8.8"
chrono = { version = "0.4.43", features = ["serde"] }
rand = "0.10.0"
serde = "1.0.228"
serde_yaml = "0.9.34"
sqlx = { version = "0.8.6", features = ["sqlite", "chrono", "runtime-tokio"] }
tokio = { version = "1.49.0", features = ["sync", "fs"] }
tracing = "0.1.44"
walkdir = "2.5.0"
uuid = { version = "1.20.0", features = [
	"v4",
	"fast-rng",
	"macro-diagnostics",
] }
utoipa = { version = "5.4.0", features = ["axum_extras", "uuid", "chrono"] }
url = "2.5.8"
