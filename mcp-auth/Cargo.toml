[package]
name = "mcp-auth"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
description = "OAuth 2.1 resource-server auth (PRM + JWKS) for MCP hosts"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = [
	"macros",
	"rt",
	"rt-multi-thread",
	"sync",
] }

serde_json = "1.0"
toml = "1.1"
tower-http = { version = "0.7", features = ["cors"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = [
	"json",
	"rustls-tls",
] }
jsonwebtoken = { version = "9", features = ["use_pem"] }
thiserror = "2"
uri = "0.4.0"
