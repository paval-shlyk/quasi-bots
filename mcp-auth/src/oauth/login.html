<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP Server — Sign in</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.4);
    }
    .logo { text-align: center; margin-bottom: 1.5rem; }
    .logo svg { width: 48px; height: 48px; }
    h1 { font-size: 1.25rem; font-weight: 600; text-align: center; margin-bottom: 0.25rem; }
    .subtitle { font-size: 0.85rem; color: #718096; text-align: center; margin-bottom: 1.75rem; }
    .error {
      background: #2d1b1b;
      border: 1px solid #742a2a;
      color: #fc8181;
      border-radius: 6px;
      padding: 0.6rem 0.8rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      padding: 0.75rem;
      background: #fff;
      border: none;
      border-radius: 6px;
      color: #1a202c;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s;
    }
    .google-btn:hover { background: #f7fafc; }
    .google-btn svg { width: 18px; height: 18px; }
    .note {
      margin-top: 1.25rem;
      font-size: 0.75rem;
      color: #718096;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="22" fill="#2b6cb0" opacity="0.2"/>
        <path d="M16 32 L24 16 L32 32" stroke="#4299e1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="24" cy="24" r="3" fill="#4299e1"/>
      </svg>
    </div>
    <h1>MCP Server</h1>
    <p class="subtitle">Sign in with Google to authorise MCP client access</p>

    {{ERROR_BLOCK}}

    <a class="google-btn" href="{{GOOGLE_HREF}}">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.13 13.72 17.57 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.43 0-11.84-4.28-13.77-10.07l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Sign in with Google
    </a>

    <p class="note">Only allowlisted Google accounts can approve access.</p>
  </div>
</body>
</html>
