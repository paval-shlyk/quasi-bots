[package]
name = "mcp-client"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
description = "MCP 2025-11-25 Streamable HTTP client with ratatui verification TUI"

[lib]
path = "src/lib.rs"

[[bin]]
name = "mcp-client"
path = "src/bin/mcp-client.rs"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true, features = [
	"macros",
	"rt-multi-thread",
	"sync",
	"net",
	"signal",
	"io-util",
	"time",
] }
serde = { workspace = true }
serde_json = "1.0"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
thiserror = "2"

rmcp = { version = "1.7", features = [
	"client",
	"auth",
	"reqwest",
	"transport-streamable-http-client-reqwest",
] }

ratatui = "0.29"
crossterm = "0.28"
url = "2"
