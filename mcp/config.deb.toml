# finance-mcp configuration
# Edit this file before starting the service.

[server]
addr = "0.0.0.0:9191"

# Single-owner credentials for the OAuth consent page
username = "admin"
password = ""  # REPLACE_WITH_A_STRONG_PASSWORD

# Public base URL used in OAuth metadata (no trailing slash)
# Example: "https://finance-mcp.example.com"
issuer = "http://localhost:9191"

[provider]
base_url  = "https://api-adapter.dzengi.com/api/v2"
api_key   = ""  # REPLACE_WITH_YOUR_DZENGI_API_KEY
api_secret = "" # REPLACE_WITH_YOUR_DZENGI_API_SECRET
