<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance MCP — Sign in</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.4);
    }
    .logo { text-align: center; margin-bottom: 1.5rem; }
    .logo svg { width: 48px; height: 48px; }
    h1 { font-size: 1.25rem; font-weight: 600; text-align: center; margin-bottom: 0.25rem; }
    .subtitle { font-size: 0.85rem; color: #718096; text-align: center; margin-bottom: 1.75rem; }
    .error {
      background: #2d1b1b;
      border: 1px solid #742a2a;
      color: #fc8181;
      border-radius: 6px;
      padding: 0.6rem 0.8rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    label { display: block; font-size: 0.8rem; font-weight: 500; color: #a0aec0; margin-bottom: 0.4rem; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 0.6rem 0.75rem;
      background: #0f1117;
      border: 1px solid #2d3748;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #4299e1;
    }
    .field { margin-bottom: 1rem; }
    button[type="submit"] {
      width: 100%;
      padding: 0.7rem;
      background: #3182ce;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.15s;
    }
    button[type="submit"]:hover { background: #2b6cb0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="22" fill="#2b6cb0" opacity="0.2"/>
        <path d="M16 32 L24 16 L32 32" stroke="#4299e1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="24" cy="24" r="3" fill="#4299e1"/>
      </svg>
    </div>
    <h1>Finance MCP</h1>
    <p class="subtitle">Sign in to authorise access to the DZENGI.com API</p>

    {{ERROR_BLOCK}}

    <form method="POST" action="/oauth/approve">
      {{HIDDEN_FIELDS}}
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Authorise</button>
    </form>
  </div>
</body>
</html>
