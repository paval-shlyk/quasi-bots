[package]
name = "scrapper"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "scrapper"
path = "src/bin/main.rs"


[[bin]]
name = "cli"
path = "src/bin/cli.rs"

[dependencies]
anyhow = "1.0.101"
axum = { version = "0.8.8", features = ["macros"] }
chrono = "0.4.43"
dashmap = "6.1.0"
feed-rs = { version = "2.3.1" }
html2text = "0.16.7"
mediatype = "=0.19"
polars = "0.51.0"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "tls-rustls", "chrono"] }
tokio = { version = "1.49.0", features = [
	"fs",
	"macros",
	"net",
	"rt",
	"rt-multi-thread",
	"sync",
] }
toml = "0.9.11"
tonic = "0.14.3"
tower-http = "0.6.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
utoipa = "5.4.0"
utoipa-scalar = "0.3.0"
yfinance-rs = "0.7.2"
