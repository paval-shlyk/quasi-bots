[package]
name = "scrapper"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "scrapper"
path = "src/bin/main.rs"

[[bin]]
name = "cli"
path = "src/bin/cli.rs"

[dependencies]
anyhow = "1.0.101"
axum = { version = "0.8.8", features = ["macros"] }
chrono = "0.4.43"
clap = { version = "4.5.58", features = ["derive"] }
dashmap = "6.1.0"
feed-rs = { version = "2.3.1" }
futures = "0.3.31"
html2text = "0.16.7"
mediatype = "=0.19"
polars = "0.51.0"
rand = "0.10.0"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["json"] }
sanitize-filename = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sqlx = { version = "0.8.6", features = [
	"runtime-tokio",
	"sqlite",
	"tls-rustls",
	"chrono",
] }
ta = "0.5.0"
tokio = { version = "1.49.0", features = [
	"fs",
	"macros",
	"net",
	"rt",
	"rt-multi-thread",
	"sync",
] }
toml = "0.9.11"
tonic = "0.14.3"
tower-http = "0.6.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
utoipa = "5.4.0"
utoipa-scalar = "0.3.0"
uuid = { version = "1.20.0", features = [
	"v4",
	"fast-rng",
	"macro-diagnostics",
] }
walkdir = "2.5.0"
yahoo_finance_api = "4.1.0"
yfinance-rs = "0.7.2"

[dev-dependencies]
proptest = "1.10.0"

[package.metadata.deb]
maintainer = "quasibots <bot@quasi.bot>"
copyright = "2024, quasibots"
assets = [
    ["systemd/scrapper.service", "/etc/systemd/system/scrapper.service", "644"]
]
