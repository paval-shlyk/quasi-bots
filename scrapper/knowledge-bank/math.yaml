  question: Define a metric space.
  truth: 'A metric space is a set X, associated with a function d (the metric) such that for all x, y, z in X: d(x,y) >= 0; d(x,y) = 0 iff x=y; d(x,y) = d(y,x); and d(x,y) <= d(x,z) + d(z,y).'
  complexity: 1
  source: https://www-cs-faculty.stanford.edu/~knuth/gkp.html
