- id: "sol_001"
  topic: "solana"
  tags: ["consensus", "poh"]
  question: "What is Proof of History (PoH) in the context of Solana?"
  truth: "Proof of History is a sequence of computation that can provide a way to cryptographically verify passage of time between two events. It uses a Verifiable Delay Function (VDF) to create a historical record that proves that an event has occurred at a specific moment in time."
  complexity: 2

- id: "sol_002"
  topic: "solana"
  tags: ["runtime", "sealevel"]
  question: "What is Sealevel in Solana architecture?"
  truth: "Sealevel is Solana's parallel runtime. It allows the validator to process tens of thousands of **transactions** in parallel (which invoke programs), utilizing the 'accounts' model to identify non-overlapping states."
  complexity: 3

- id: "sol_003"
  topic: "solana"
  tags: ["accounts", "storage"]
  question: "What is an Account in Solana?"
  truth: "In Solana, everything is an account. An account is a storage buffer that can hold data (state) or executable code (programs). Accounts are identified by a 32-byte Ed25519 public key."
  complexity: 1

- id: "sol_004"
  topic: "solana"
  tags: ["accounts", "rent"]
  question: "What is 'Rent' in Solana?"
  truth: "Rent is a fee paid by accounts to store data on the blockchain. If an account maintains a minimum balance equivalent to 2 years of rent payments (rent-exempt), it does not need to pay rent. Accounts unable to pay rent are purged."
  complexity: 1

- id: "sol_005"
  topic: "solana"
  tags: ["pda", "security"]
  question: "What is a Program Derived Address (PDA)?"
  truth: "A PDA is an address derived deterministically from a program ID and a set of seeds. Unlike regular accounts, PDAs do not have a corresponding private key. They allow programs to 'sign' for addresses they control."
  complexity: 2

- id: "sol_006"
  topic: "solana"
  tags: ["cpi", "composability"]
  question: "What is a Cross-Program Invocation (CPI)?"
  truth: "A CPI is a call from one Solana program to another. It allows for composability, enabling programs to utilize the functionality of other programs (e.g., a custom program calling the Token Program to transfer tokens)."
  complexity: 2

- id: "sol_007"
  topic: "solana"
  tags: ["anchor", "development"]
  question: "What is the Anchor framework?"
  truth: "Anchor is a development framework for Solana Sealevel runtime providing several developer tools. It abstracts away low-level details like account deserialization and instruction data parsing, providing a Rust-based eDSL for writing secure programs."
  complexity: 2

- id: "sol_008"
  topic: "solana"
  tags: ["token-program", "spl"]
  question: "What is the SPL Token Program?"
  truth: "The SPL Token Program is the standard implementation for fungible and non-fungible tokens on Solana. It defines how mints and token accounts behave, similar to ERC-20 on Ethereum."
  complexity: 1

- id: "sol_009"
  topic: "solana"
  tags: ["accounts", "lamports"]
  question: "What is a Lamport?"
  truth: "A Lamport is the smallest unit of SOL. One SOL equals one billion (10^9) Lamports."
  complexity: 1

- id: "sol_010"
  topic: "solana"
  tags: ["transactions", "instructions"]
  question: "What is the relationship between a Transaction and an Instruction?"
  truth: "A Transaction contains one or more Instructions. The transaction is the atomic unit submitted to the network, meaning either all instructions within it succeed, or the entire transaction fails."
  complexity: 1

- id: "sol_011"
  topic: "solana"
  tags: ["pda", "curve"]
  question: "Why must a PDA fall 'off the curve'?"
  truth: "A PDA must be a 32-byte value that is **not a valid point** on the Ed25519 curve. This mathematically guarantees that no corresponding private key exists, meaning only the program (via seeds) can sign for this address."
  complexity: 3

- id: "sol_012"
  topic: "solana"
  tags: ["anchor", "idl"]
  question: "What is an IDL in Anchor?"
  truth: "IDL stands for Interface Description Language. It is a JSON file generated by Anchor that describes a program's public interface (instructions, accounts, types), enabling client-side SDKs to interact with the program easily."
  complexity: 2

- id: "sol_013"
  topic: "solana"
  tags: ["accounts", "ownership"]
  question: "Who owns an account in Solana?"
  truth: "Every account has an 'owner' field specifying the Program ID that owns it. Only the owner program can modify the account's data or deduct lamports (though anyone can add lamports)."
  complexity: 2

- id: "sol_014"
  topic: "solana"
  tags: ["token-program", "ata"]
  question: "What is an Associated Token Account (ATA)?"
  truth: "An ATA is a specific Token Account derived deterministically from the wallet address and the token mint address. It simplifies token management by providing a standard address for a user's holdings of a specific token."
  complexity: 2

- id: "sol_015"
  topic: "solana"
  tags: ["consensus", "tower-bft"]
  question: "What is Tower BFT?"
  truth: "Tower BFT is Solana's custom implementation of Practical Byzantine Fault Tolerance (PBFT), optimized to work with Proof of History. It allows validators to vote on forks and reach consensus without massive messaging overhead."
  complexity: 3

- id: "sol_016"
  topic: "solana"
  tags: ["pda", "seeds"]
  question: "What are 'seeds' in the context of PDAs?"
  truth: "Seeds are arbitrary byte arrays (e.g., strings, numbers, other public keys) used in combination with a program ID to derive a PDA. They allow for deterministic address generation."
  complexity: 2

- id: "sol_017"
  topic: "solana"
  tags: ["cpi", "signer"]
  question: "How does a program sign for a PDA during a CPI?"
  truth: "A program uses `invoke_signed`. It passes the seeds and the bump seed used to derive the PDA. The runtime verifies the seeds generate the PDA and then virtually signs the transaction on behalf of that PDA."
  complexity: 3

- id: "sol_018"
  topic: "solana"
  tags: ["anchor", "macros"]
  question: "What does the `#[program]` macro do in Anchor?"
  truth: "The `#[program]` macro defines the module containing the program's instruction logic. It acts as the entry point and routes incoming instructions to the correct function handler."
  complexity: 2

- id: "sol_019"
  topic: "solana"
  tags: ["transactions", "atomic"]
  question: "What is meant by 'atomic execution' in Solana?"
  truth: "Atomic execution ensures that if any instruction within a transaction fails, all changes made by previous instructions in that same transaction are reverted. The state remains consistent."
  complexity: 2

- id: "sol_020"
  topic: "solana"
  tags: ["token-program", "decimals"]
  question: "How are decimals handled in the SPL Token Program?"
  truth: "Decimals are stored as a byte in the Mint account. They determine the UI representation of token amounts (e.g., 6 decimals means 1,000,000 raw units = 1 UI token), but logic operates on raw amounts."
  complexity: 1

- id: "sol_021"
  topic: "solana"
  tags: ["runtime", "bpf", "sbf"]
  question: "What is SBF (Solana Bytecode Format)?"
  truth: "SBF is a variation of eBPF (Extended Berkeley Packet Filter) used by Solana. Programs are compiled into SBF bytecode, which the Solana runtime executes efficiently and safely."
  complexity: 3

- id: "sol_022"
  topic: "solana"
  tags: ["anchor", "accounts"]
  question: "What is the purpose of the `#[account]` macro in Anchor?"
  truth: "The `#[account]` macro implements serialization and deserialization traits for a struct, creates a unique discriminator (8 bytes) to distinguish account types, and marks it as an account structure."
  complexity: 2

- id: "sol_023"
  topic: "solana"
  tags: ["accounts", "executable"]
  question: "What distinguishes an executable account from a regular account?"
  truth: "An executable account has the `executable` flag set to true. It contains immutable program bytecode and is owned by the BPF Loader (or a variation of it)."
  complexity: 2

- id: "sol_024"
  topic: "solana"
  tags: ["pda", "bump"]
  question: "What is a 'bump' or 'bump seed'?"
  truth: "When deriving a PDA, the combination of seeds might result in a valid Ed25519 key (on the curve). The bump is an additional 1-byte seed (0-255) decremented until a valid off-curve address is found. This canonical bump is stored to regenerate the address later."
  complexity: 3

- id: "sol_025"
  topic: "solana"
  tags: ["cpi", "limit"]
  question: "Is there a limit to CPI depth?"
  truth: "Yes, the maximum call depth for Cross-Program Invocations is currently restricted (historically 4 or similar low number) to prevent stack overflows and excessive resource consumption."
  complexity: 2

- id: "sol_026"
  topic: "solana"
  tags: ["anchor", "validation"]
  question: "How does Anchor handle input validation?"
  truth: "Anchor uses constraints in the `Accounts` struct validation, such as `#[account(mut)]`, `#[account(has_one = authority)]`, or raw constraints like `#[account(constraint = x > y)]` to validate account state before execution."
  complexity: 2

- id: "sol_027"
  topic: "solana"
  tags: ["consensus", "leader"]
  question: "What is a Leader in Solana's consensus?"
  truth: "A Leader is a validator node elected to append entries to the ledger for a specific time slot. Leaders rotate according to a schedule determined by stake weight."
  complexity: 2

- id: "sol_028"
  topic: "solana"
  tags: ["transactions", "fee"]
  question: "How are transaction fees calculated in Solana?"
  truth: "Transaction fees are primarily determined by the number of signatures required in the transaction. There is also a prioritization fee market where users can pay extra for higher priority."
  complexity: 2

- id: "sol_029"
  topic: "solana"
  tags: ["token-program", "nft"]
  question: "How is an NFT represented in the SPL Token Program?"
  truth: "An NFT is typically an SPL Token Mint with a supply of exactly 1, 0 decimals, and mint authority disabled after minting, often paired with Metaplex metadata accounts."
  complexity: 2

- id: "sol_030"
  topic: "solana"
  tags: ["accounts", "data"]
  question: "What is the maximum size of a Solana account?"
  truth: "Traditionally, accounts were limited to 10MB (max reallocation size), but practical limits depend on rent and specific program logic. The `realloc` feature allows resizing accounts up to 10MB."
  complexity: 2

- id: "sol_031"
  topic: "solana"
  tags: ["pda", "hash"]
  question: "Which hash function is used to derive PDAs?"
  truth: "SHA-256 is used. The program ID and seeds are hashed using SHA-256 to verify if the result lies on the Ed25519 curve."
  complexity: 3

- id: "sol_032"
  topic: "solana"
  tags: ["cpi", "privilege"]
  question: "What is 'Privilege Extension' in CPIs?"
  truth: "When Program A calls Program B, Program B inherits the signer privileges of the accounts passed to it. If Alice signs a transaction calling A, and A calls B passing Alice's account, B sees Alice as a signer."
  complexity: 3

- id: "sol_033"
  topic: "solana"
  tags: ["anchor", "context"]
  question: "What is the `Context<T>` struct in Anchor?"
  truth: "The `Context` struct wraps the accounts required for an instruction. It provides access to the `accounts`, `program_id`, and `remaining_accounts` needed for the logic execution."
  complexity: 2

- id: "sol_034"
  topic: "solana"
  tags: ["token-program", "authority"]
  question: "What are the different authorities on an SPL Token Mint?"
  truth: "A Mint has a 'Mint Authority' (can create new tokens) and a 'Freeze Authority' (can freeze token accounts holding this mint's tokens)."
  complexity: 1

- id: "sol_035"
  topic: "solana"
  tags: ["poh", "sha256"]
  question: "Does Proof of History use SHA-256?"
  truth: "Yes, PoH uses a recursive SHA-256 hash function where the output of the current hash is the input for the next, creating an unbreakable chain of time."
  complexity: 2

- id: "sol_036"
  topic: "solana"
  tags: ["runtime", "turbine"]
  question: "What is Turbine?"
  truth: "Turbine is Solana's block propagation protocol. It breaks blocks into small packets (shreds) and uses a tree structure to propagate them rapidly among validators, similar to BitTorrent."
  complexity: 3

- id: "sol_037"
  topic: "solana"
  tags: ["anchor", "error"]
  question: "How are errors handled in Anchor?"
  truth: "Anchor provides an `#[error_code]` macro (formerly `#[error]`) to define custom enums for errors. These are mapped to specific error codes returned to the client when a constraint fails."
  complexity: 2

- id: "sol_038"
  topic: "solana"
  tags: ["accounts", "sysvar"]
  question: "What are Sysvar accounts?"
  truth: "Sysvar accounts are special accounts at predefined addresses that provide cluster state information, such as the current Clock, Rent parameters, Stake history, or recent blockhashes."
  complexity: 2

- id: "sol_039"
  topic: "solana"
  tags: ["cpi", "return-data"]
  question: "Can a program return data to the caller in a CPI?"
  truth: "Yes, Solana introduced 'Return Data' which allows a program to set a specific byte buffer that the calling program (or client) can read after the instruction completes."
  complexity: 3

- id: "sol_040"
  topic: "solana"
  tags: ["pda", "mapping"]
  question: "Common use case: How to create a mapping of User -> Data using PDAs?"
  truth: "You can derive a PDA using the User's public key as a seed (e.g., `[b'user_stats', user_pubkey]`). This creates a unique, deterministic address for storing data specific to that user."
  complexity: 2

- id: "sol_041"
  topic: "solana"
  tags: ["token-program", "close"]
  question: "What happens when you close a Token Account?"
  truth: "Closing a token account transfers the remaining lamports (rent) to a specified destination wallet and removes the account from storage. The token balance must be zero to close it."
  complexity: 1

- id: "sol_042"
  topic: "solana"
  tags: ["runtime", "gulf-stream"]
  question: "What is Gulf Stream?"
  truth: "Gulf Stream is Solana's mempool-less transaction forwarding protocol. It pushes transaction caching and forwarding to the edge of the network, allowing validators to execute transactions ahead of time."
  complexity: 3

- id: "sol_043"
  topic: "solana"
  tags: ["anchor", "init"]
  question: "What does `init` do in an Anchor account constraint?"
  truth: "The `init` constraint tells Anchor to create (system_instruction::create_account) and initialize the account. It typically requires a `payer` and `space` specification."
  complexity: 2

- id: "sol_044"
  topic: "solana"
  tags: ["accounts", "native"]
  question: "What is the Native Token in Solana?"
  truth: "SOL is the native token. However, in the context of the Token Program, 'Wrapped SOL' is an SPL token that represents native SOL, allowing it to be treated like any other SPL token."
  complexity: 1

- id: "sol_045"
  topic: "solana"
  tags: ["transactions", "versioned"]
  question: "What are Versioned Transactions?"
  truth: "Versioned transactions support newer transaction formats, specifically enabling Address Lookup Tables (ALUTs), which allow transactions to load more accounts than previously possible by referencing an on-chain table."
  complexity: 3

- id: "sol_046"
  topic: "solana"
  tags: ["anchor", "zero-copy"]
  question: "What is Zero-Copy deserialization in Anchor?"
  truth: "For large accounts, Anchor supports `#[account(zero_copy)]`. This allows programs to interact with account data directly from memory without the expensive overhead of deserializing the entire account into a Rust struct."
  complexity: 3

- id: "sol_047"
  topic: "solana"
  tags: ["token-program", "transfer"]
  question: "What is the difference between `transfer` and `transfer_checked`?"
  truth: "`transfer_checked` requires passing the mint address and decimals. It validates that the source/destination accounts match the mint and that the amount aligns with the expected decimals, offering higher safety than simple `transfer`."
  complexity: 2

- id: "sol_048"
  topic: "solana"
  tags: ["pda", "canonical"]
  question: "Why should you always use the canonical bump for PDAs?"
  truth: "Using the canonical bump (the highest valid bump) ensures the address is deterministic and unique. If any valid bump were allowed, malicious actors could create multiple valid addresses for the same seeds, potentially bypassing security checks."
  complexity: 3

- id: "sol_049"
  topic: "solana"
  tags: ["sealevel", "parallelism"]
  question: "How does Sealevel determine which transactions can run in parallel?"
  truth: "It looks at the accounts required by the instructions. If two transactions do not write to the same account state (or lock the same account), they can be executed simultaneously."
  complexity: 2

- id: "sol_050"
  topic: "solana"
  tags: ["accounts", "system-program"]
  question: "What is the System Program?"
  truth: "The System Program is a native program responsible for creating new accounts, transferring native SOL, and assigning account ownership."
  complexity: 1
