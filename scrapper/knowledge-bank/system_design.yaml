- id: "sys_001"
  topic: "system-design"
  tags: ["reliability", "ddia"]
  question: "What is the difference between a fault and a failure in system design?"
  truth: "A fault is a component deviating from its spec (e.g., a crashed hard drive, a software bug). A failure is when the system as a whole stops providing the required service to the user. System design aims to build fault-tolerant mechanisms that prevent faults from causing failures."
  complexity: 1

- id: "sys_002"
  topic: "system-design"
  tags: ["scalability", "ddia"]
  question: "Describe the difference between vertical scaling (scaling up) and horizontal scaling (scaling out)."
  truth: "Vertical scaling involves adding more power (CPU, RAM) to an existing server. It is simpler but has a hard hardware limit and creates a single point of failure. Horizontal scaling involves adding more servers to a pool. It offers theoretically infinite scale and redundancy but introduces complexity in management and data consistency."
  complexity: 1

- id: "sys_003"
  topic: "system-design"
  tags: ["sre", "metrics"]
  question: "Define SLA, SLO, and SLI."
  truth: "SLI (Service Level Indicator) is a quantitative measure of service health (e.g., latency). SLO (Service Level Objective) is a target value for an SLI (e.g., 99.9% of requests < 200ms). SLA (Service Level Agreement) is a contract with users outlining consequences if SLOs are not met."
  complexity: 1

- id: "sys_004"
  topic: "system-design"
  tags: ["load-balancing", "network"]
  question: "What is the difference between Layer 4 and Layer 7 load balancing?"
  truth: "Layer 4 (Transport Layer) load balancing routes traffic based on IP address and port (TCP/UDP) without inspecting packet contents. Layer 7 (Application Layer) load balancing makes routing decisions based on content, such as HTTP headers, URLs, or cookies, allowing for smarter routing like sticky sessions."
  complexity: 2

- id: "sys_005"
  topic: "system-design"
  tags: ["load-balancing", "algorithms"]
  question: "Explain the Consistent Hashing algorithm and its primary benefit."
  truth: "Consistent hashing maps both data keys and servers to a unit circle (hash ring). A key is assigned to the next server found clockwise on the ring. Its main benefit is minimizing data movement when scaling: adding or removing a server only affects the keys in its immediate vicinity, rather than reshuffling nearly all keys as with modular hashing (hash % n)."
  complexity: 2

- id: "sys_006"
  topic: "system-design"
  tags: ["databases", "acid"]
  question: "What does ACID stand for in the context of database transactions?"
  truth: "Atomicity (all or nothing), Consistency (data moves from one valid state to another), Isolation (concurrent transactions don't interfere with each other), and Durability (committed transactions are permanent even after power loss)."
  complexity: 1

- id: "sys_007"
  topic: "system-design"
  tags: ["databases", "cap-theorem"]
  question: "Explain the CAP theorem."
  truth: "The CAP theorem states that a distributed data store can effectively provide only two of the following three guarantees: Consistency (every read receives the most recent write or an error), Availability (every request receives a (non-error) response, without the guarantee that it contains the most recent write), and Partition Tolerance (the system continues to operate despite an arbitrary number of messages being dropped or delayed by the network)."
  complexity: 2

- id: "sys_008"
  topic: "system-design"
  tags: ["databases", "nosql"]
  question: "What is the BASE consistency model often used in NoSQL systems?"
  truth: "BASE stands for Basically Available, Soft state, and Eventual consistency. It prioritizes availability over immediate consistency, contrasting with ACID. The system guarantees that if no new updates are made, eventually all accesses will return the last updated value."
  complexity: 1

- id: "sys_009"
  topic: "system-design"
  tags: ["caching", "strategies"]
  question: "Explain the 'Cache-Aside' (Lazy Loading) pattern."
  truth: "The application looks for data in the cache first. If found (cache hit), it returns it. If not found (cache miss), the application loads data from the database, writes it to the cache, and then returns it. This ensures only requested data is cached but introduces a penalty on cache misses."
  complexity: 1

- id: "sys_010"
  topic: "system-design"
  tags: ["caching", "strategies"]
  question: "Explain the 'Write-Through' caching pattern."
  truth: "In Write-Through, data is written to the cache and the database simultaneously. This ensures consistency between cache and DB and simplifies data retrieval (data is always in cache), but writes are slower because they must go to both locations."
  complexity: 1

- id: "sys_011"
  topic: "system-design"
  tags: ["caching", "eviction"]
  question: "What is an LRU cache eviction policy?"
  truth: "Least Recently Used (LRU) discards the items that haven't been used for the longest time first. It assumes that data accessed recently is likely to be accessed again soon."
  complexity: 1

- id: "sys_012"
  topic: "system-design"
  tags: ["databases", "indexing"]
  question: "Compare B-Trees and LSM-Trees (Log-Structured Merge-Trees)."
  truth: "B-Trees are the standard for SQL DBs, optimized for read-heavy workloads with update-in-place mechanics. LSM-Trees (used in Cassandra, RocksDB) are optimized for high write throughput by appending writes to a log and merging sorted files in the background, though reads may be slower as they check multiple levels."
  complexity: 2

- id: "sys_013"
  topic: "system-design"
  tags: ["replication", "ddia"]
  question: "What is the difference between Synchronous and Asynchronous replication?"
  truth: "Synchronous replication waits for the follower to confirm the write before reporting success to the client, guaranteeing durability but risking high latency or unavailability if the follower stalls. Asynchronous replication reports success immediately after the leader writes, offering low latency but risking data loss if the leader crashes before propagating the change."
  complexity: 1

- id: "sys_014"
  topic: "system-design"
  tags: ["replication", "consistency"]
  question: "What is 'Replication Lag' and what issues can it cause?"
  truth: "Replication lag is the delay between a write happening on the leader and it appearing on a follower. In read-scaling architectures, this causes 'stale reads,' where a user might see old data immediately after writing new data."
  complexity: 1

- id: "sys_015"
  topic: "system-design"
  tags: ["replication", "consistency"]
  question: "Explain 'Read-Your-Own-Writes' consistency."
  truth: "It guarantees that if a user reloads the page after making an update, they will see that update. This is often implemented by routing reads for a specific user to the leader for a short period after they perform a write."
  complexity: 2

- id: "sys_016"
  topic: "system-design"
  tags: ["partitioning", "sharding"]
  question: "What is the difference between horizontal partitioning (sharding) and vertical partitioning?"
  truth: "Horizontal partitioning splits a table by rows (e.g., User IDs 1-1000 in Shard A, 1001-2000 in Shard B). Vertical partitioning splits a table by columns (e.g., storing massive text descriptions in a separate table/server from the core user metadata to improve performance)."
  complexity: 1

- id: "sys_017"
  topic: "system-design"
  tags: ["partitioning", "hotspot"]
  question: "What is the 'Celebrity Problem' or 'Hot Partition' issue in sharding?"
  truth: "This occurs when a specific shard key (e.g., Justin Bieber's user ID) receives a disproportionate amount of traffic, overloading a single shard while others are idle. Solutions include adding salt to the key to distribute traffic across multiple replicas."
  complexity: 2

- id: "sys_018"
  topic: "system-design"
  tags: ["api", "communication"]
  question: "Compare REST and gRPC."
  truth: "REST typically uses JSON over HTTP/1.1, is text-based, human-readable, and widely supported. gRPC uses Protocol Buffers (binary) over HTTP/2, supports streaming, is strongly typed, and is generally more performant and compact, making it better for internal microservices communication."
  complexity: 2

- id: "sys_019"
  topic: "system-design"
  tags: ["api", "polling"]
  question: "What is the difference between Long Polling and WebSockets?"
  truth: "Long Polling involves the client making a request that the server holds open until data is available, then immediately closing it (simulating push). WebSockets create a persistent, full-duplex TCP connection, allowing real-time, bidirectional communication with lower overhead."
  complexity: 1

- id: "sys_020"
  topic: "system-design"
  tags: ["databases", "sql-vs-nosql"]
  question: "When should you choose a NoSQL database over a relational (SQL) database?"
  truth: "Choose NoSQL when data is unstructured or the schema changes frequently, when massive write throughput or horizontal scaling (sharding) is a priority over ACID compliance, or for specialized use cases like graph relationships or time-series data."
  complexity: 1

- id: "sys_021"
  topic: "system-design"
  tags: ["messaging", "async"]
  question: "What is the purpose of a Message Queue in system design?"
  truth: "Message queues (like RabbitMQ, Kafka) decouple producers from consumers, allowing for asynchronous processing, traffic spike smoothing (load leveling), and improved reliability by ensuring messages are persisted until processed."
  complexity: 1

- id: "sys_022"
  topic: "system-design"
  tags: ["scalability", "caching"]
  question: "What is the 'Thundering Herd' problem?"
  truth: "It occurs when a popular cache item expires, and a massive number of concurrent requests all miss the cache simultaneously and hit the database to regenerate the same value, potentially crashing the database."
  complexity: 2

- id: "sys_023"
  topic: "system-design"
  tags: ["id-generation", "distributed"]
  question: "Why might you use Snowflake IDs (like Twitter Snowflake) over database auto-increment IDs?"
  truth: "Auto-increment IDs are difficult to synchronize across sharded databases (single point of failure). Snowflake IDs are generated independently by distributed servers using timestamps and machine IDs, providing roughly sorted, unique 64-bit integers without coordination."
  complexity: 2

- id: "sys_024"
  topic: "system-design"
  tags: ["load-balancing", "dns"]
  question: "How does DNS Round Robin work as a load balancing technique?"
  truth: "The DNS server returns a list of IP addresses for a single domain name, rotating the order for each request. It is a simple, client-side load balancing method but lacks knowledge of server health or load."
  complexity: 1

- id: "sys_025"
  topic: "system-design"
  tags: ["caching", "cdn"]
  question: "What is a CDN (Content Delivery Network) and how does it improve performance?"
  truth: "A CDN is a geographically distributed network of proxy servers. It improves performance by serving static content (images, CSS, JS) from a server (Edge Location) physically closer to the user, reducing latency and offloading traffic from the origin server."
  complexity: 1

- id: "sys_026"
  topic: "system-design"
  tags: ["databases", "transactions"]
  question: "What is Optimistic Locking?"
  truth: "Optimistic locking assumes conflicts are rare. It reads a record along with a version number. When updating, it checks if the version number has changed. If it has, the transaction fails and must retry. It avoids database-level locks."
  complexity: 2

- id: "sys_027"
  topic: "system-design"
  tags: ["databases", "transactions"]
  question: "What is Pessimistic Locking?"
  truth: "Pessimistic locking assumes conflicts are likely. It locks the record in the database as soon as it is read, preventing others from modifying it until the transaction is committed or rolled back."
  complexity: 2

- id: "sys_028"
  topic: "system-design"
  tags: ["data-encoding", "ddia"]
  question: "Why are schema evolution capabilities important in data serialization formats (like Avro or Protobuf)?"
  truth: "In distributed systems, rolling updates mean old code and new code run simultaneously. Formats supporting schema evolution allow new code to read data written by old code (backward compatibility) and old code to read data written by new code (forward compatibility) without crashing."
  complexity: 2

- id: "sys_029"
  topic: "system-design"
  tags: ["discovery", "microservices"]
  question: "What is Service Discovery?"
  truth: "In dynamic environments (like Kubernetes), service IP addresses change frequently. Service Discovery allows services to find each other via a registry (like Consul, ZooKeeper, or etcd) rather than hardcoded IPs."
  complexity: 1

- id: "sys_030"
  topic: "system-design"
  tags: ["rate-limiting", "security"]
  question: "Explain the Token Bucket algorithm for rate limiting."
  truth: "A bucket is refilled with tokens at a constant rate. Each request consumes a token. If the bucket is empty, the request is rejected. This allows for bursts of traffic (up to bucket capacity) while enforcing an average rate."
  complexity: 2

- id: "sys_031"
  topic: "system-design"
  tags: ["rate-limiting", "security"]
  question: "Explain the Leaky Bucket algorithm for rate limiting."
  truth: "Requests enter a queue (bucket) and are processed at a constant, fixed rate. If the queue is full, new requests are discarded. This smooths out bursts into a stable outflow."
  complexity: 2

- id: "sys_032"
  topic: "system-design"
  tags: ["networking", "protocol"]
  question: "What is the difference between TCP and UDP?"
  truth: "TCP is connection-oriented, reliable, and guarantees order (used for HTTP, emails). UDP is connectionless, unreliable (packets can be dropped or arrive out of order), but faster and lower overhead (used for video streaming, gaming, DNS)."
  complexity: 1

- id: "sys_033"
  topic: "system-design"
  tags: ["search", "indexing"]
  question: "What is an Inverted Index?"
  truth: "Used by search engines (like Elasticsearch), an inverted index maps content (words/terms) to their location in a document or a set of documents, allowing for very fast full-text searches."
  complexity: 2

- id: "sys_034"
  topic: "system-design"
  tags: ["security", "auth"]
  question: "Difference between Authentication and Authorization."
  truth: "Authentication is verifying *who* you are (login). Authorization is verifying *what* you are allowed to do (permissions)."
  complexity: 0

- id: "sys_035"
  topic: "system-design"
  tags: ["hashing", "security"]
  question: "Why is it important to salt passwords before hashing them?"
  truth: "Salting adds a random string to the password before hashing. This prevents Rainbow Table attacks (precomputed hash lookups) and ensures that two users with the same password have different hashes."
  complexity: 1

- id: "sys_036"
  topic: "system-design"
  tags: ["monitoring", "observability"]
  question: "What are the three pillars of Observability?"
  truth: "Logs (discrete events), Metrics (aggregatable numerical data), and Traces (request lifecycle across microservices)."
  complexity: 1

- id: "sys_037"
  topic: "system-design"
  tags: ["databases", "columnar"]
  question: "What is a Columnar Database and when is it used?"
  truth: "A columnar database stores data by columns rather than rows. It is optimized for OLAP (Online Analytical Processing) workloads where queries often aggregate large amounts of data over a few columns (e.g., 'average salary' across 1 million rows) but is slower for single-row writes."
  complexity: 2

- id: "sys_038"
  topic: "system-design"
  tags: ["load-balancing", "proxy"]
  question: "What is a Reverse Proxy?"
  truth: "A server that sits in front of web servers and forwards client requests to them. It provides security, SSL termination, load balancing, and caching, hiding the internal network topology from the client."
  complexity: 1

- id: "sys_039"
  topic: "system-design"
  tags: ["patterns", "resiliency"]
  question: "What is the Circuit Breaker pattern?"
  truth: "A design pattern that prevents an application from repeatedly trying to execute an operation that's likely to fail. If failures cross a threshold, the 'circuit opens' and requests fail immediately without waiting for timeouts, allowing the struggling system to recover."
  complexity: 2

- id: "sys_040"
  topic: "system-design"
  tags: ["patterns", "deployment"]
  question: "What is Blue-Green Deployment?"
  truth: "A release strategy where two identical environments exist (Blue and Green). One is live. The new version is deployed to the idle environment. Once tested, traffic is switched over instantly via load balancer. This simplifies rollback."
  complexity: 1

- id: "sys_041"
  topic: "system-design"
  tags: ["patterns", "deployment"]
  question: "What is Canary Deployment?"
  truth: "Rolling out a new version to a small subset of users (e.g., 5%) first. Metrics are monitored for errors. If stable, the rollout gradually increases to 100%. If errors occur, it is rolled back with minimal impact."
  complexity: 1

- id: "sys_042"
  topic: "system-design"
  tags: ["distributed-systems", "consensus"]
  question: "What is a Distributed Consensus algorithm (like Paxos or Raft) used for?"
  truth: "They allow a collection of computers to agree on a single value or state, even if some nodes fail. They are crucial for leader election and consistent state replication in distributed systems."
  complexity: 2

- id: "sys_043"
  topic: "system-design"
  tags: ["databases", "bloom-filter"]
  question: "What is a Bloom Filter?"
  truth: "A probabilistic data structure used to test whether an element is a member of a set. It is very space-efficient but has false positives (it can say 'maybe in set' or 'definitely not in set'). It is often used to avoid expensive disk lookups for non-existent keys."
  complexity: 2

- id: "sys_044"
  topic: "system-design"
  tags: ["api", "graphql"]
  question: "What is the main problem GraphQL solves compared to REST?"
  truth: "Over-fetching (getting too much data) and under-fetching (needing multiple requests to get related data). GraphQL allows the client to specify exactly the data structure it needs in a single request."
  complexity: 1

- id: "sys_045"
  topic: "system-design"
  tags: ["messaging", "kafka"]
  question: "What is the difference between a Queue and a Topic (Pub/Sub)?"
  truth: "In a Queue (Point-to-Point), a message is processed by only one consumer. In a Topic (Publish/Subscribe), a message is broadcast to all subscribers who are listening to that topic."
  complexity: 1

- id: "sys_046"
  topic: "system-design"
  tags: ["networking", "caching"]
  question: "What is the difference between HTTP 1.1 and HTTP/2?"
  truth: "HTTP/2 introduces binary framing (instead of text), header compression, and multiplexing (multiple requests over a single TCP connection), significantly reducing latency compared to HTTP 1.1's head-of-line blocking."
  complexity: 1

- id: "sys_047"
  topic: "system-design"
  tags: ["data-integrity", "checksum"]
  question: "How do systems detect data corruption during transmission or storage?"
  truth: "Using checksums (like CRC32 or MD5). The sender calculates a value based on the data bytes. The receiver calculates it again. If they don't match, the data is corrupted."
  complexity: 0

- id: "sys_048"
  topic: "system-design"
  tags: ["patterns", "cqrs"]
  question: "What is CQRS (Command Query Responsibility Segregation)?"
  truth: "A pattern that separates read and write operations into different models. Commands (writes) update the state, while Queries (reads) retrieve it, allowing each side to be scaled and optimized independently (e.g., complex writes vs fast reads)."
  complexity: 2

- id: "sys_049"
  topic: "system-design"
  tags: ["databases", "normalization"]
  question: "What is Database Normalization?"
  truth: "The process of organizing data to reduce redundancy and improve data integrity (e.g., ensuring a customer's address is stored in only one place). It usually involves splitting tables and using foreign keys."
  complexity: 1

- id: "sys_050"
  topic: "system-design"
  tags: ["databases", "denormalization"]
  question: "Why would you Denormalize a database?"
  truth: "To improve read performance by avoiding expensive joins. By adding redundant data (duplicating the address into the Orders table), queries become faster at the cost of more complex updates and potential inconsistency."
  complexity: 1
