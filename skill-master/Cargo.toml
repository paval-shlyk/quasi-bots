[package]
name = "skill-master"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[[bin]]
name = "skill-master"
path = "src/bin/main.rs"

[dependencies]
anyhow = "1.0.101"
axum = { version = "0.8.8", features = ["macros"] }
chrono = "0.4.43"
clap = { version = "4.5.58", features = ["derive"] }
dashmap = "6.1.0"
feed-rs = { version = "2.3.1" }
futures = "0.3.31"
html2text = "0.16.7"
knowledge = { version = "0.1.0", path = "../knowledge" }
mediatype = "=0.19"
polars = "0.51.0"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["json"] }
sanitize-filename = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = [
	"runtime-tokio",
	"sqlite",
	"tls-rustls",
	"chrono",
] }
ta = "0.5.0"
tokio = { version = "1.49.0", features = [
	"fs",
	"macros",
	"net",
	"rt",
	"rt-multi-thread",
	"sync",
] }
toml = "0.9.11"
tower-http = "0.6.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
utoipa = "5.4.0"
utoipa-scalar = "0.3.0"
yahoo_finance_api = "4.1.0"
yfinance-rs = "0.7.2"

[dev-dependencies]
proptest = "1.10.0"

[package.metadata.deb]
maintainer = "Paval Shlyk <paval.shlyk@quasi.su>"
copyright = "2026, quasi.su"
depends = "$auto, ca-certificates, openssl"
systemd-units = { enable = true }
assets = [
    ["systemd/skill-master.service", "/etc/systemd/system/skill-master.service", "644"],
    ["config.deb.toml", "/etc/skill-master/config.toml", "640"],
    ["knowledge-bank/*", "/var/lib/skill-master/knowledge-bank/", "644"]
]
