- id: algo_013
  topic: algorithms
  tags:
  - dynamic-programming
  - lcs
  question: What is the recurrence relation for the Longest Common Subsequence (LCS) of two sequences X and Y of lengths m and n?
  truth: If X[i] == Y[j], LCS(i, j) = 1 + LCS(i-1, j-1). If X[i] != Y[j], LCS(i, j) = max(LCS(i-1, j), LCS(i, j-1)).
  complexity: 3
  source: https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/
- id: algo_014
  topic: algorithms
  tags:
  - trees
  - avl
  question: What is the balance condition for an AVL tree?
  truth: For every node, the height difference (balance factor) between its left and right subtrees must be at most 1 (-1, 0, or 1).
  complexity: 3
  source: https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/
- id: algo_015
  topic: algorithms
  tags:
  - hashing
  - collision-resolution
  question: Describe Open Addressing in the context of hash tables.
  truth: In Open Addressing, all elements are stored within the hash table array itself. When a collision occurs, the algorithm probes for the next empty slot using a sequence (e.g., linear probing, quadratic probing).
  complexity: 3
  source: https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/
