- id: algo_018
  topic: algorithms
  tags:
  - complexity
  - master-theorem
  question: Given T(n) = 2T(n/2) + n^2, what is the complexity using the Master Theorem?
  truth: O(n^2). Here a=2, b=2, f(n)=n^2. n^(log_b a) = n^1 = n. Since f(n) is Omega(n^(1+epsilon)), the third case applies.
  complexity: 4
  source: https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/
