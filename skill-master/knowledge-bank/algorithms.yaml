  source: https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/
- id: algo_010
  topic: algorithms
  tags:
  - complexity
  - big-o
  question: If f(n) = O(g(n)), does this imply g(n) = O(f(n))?
  truth: No. For example, if f(n) = n and g(n) = n^2, then n = O(n^2) is true, but n^2 = O(n) is false.
  complexity: 2
  source: https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/
