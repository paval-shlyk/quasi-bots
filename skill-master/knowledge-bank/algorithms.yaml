- id: algo_009
  topic: algorithms
  tags:
  - trees
  - red-black-tree
  question: What is the maximum height of a Red-Black tree with n internal nodes?
  truth: The height is at most 2 lg(n + 1). This ensures that operations like search, insert, and delete take O(lg n) time.
