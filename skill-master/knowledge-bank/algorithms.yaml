- id: algo_001
  topic: algorithms
  tags:
  - sorting
  - comparison-sort
  question: What is the lower bound for the worst-case running time of any comparison-based sorting algorithm?
  truth: The lower bound is Omega(n lg n). This is derived from the decision tree model, where a tree of height h with n! leaves implies h >= lg(n!).
  complexity: 2
  source: https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/
- id: algo_002
  topic: algorithms
  tags:
  - sorting
  - quicksort
  question: In Quicksort, what is the worst-case time complexity and under what condition does it typically occur?
  truth: O(n^2). This typically occurs when the input array is already sorted or reverse sorted, and the pivot is chosen as the first or last element.
  complexity: 2
  source: https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/
- id: algo_003
  topic: algorithms
  tags:
  - sorting
  - heapsort
  question: Is Heapsort a stable sorting algorithm?
  truth: No, Heapsort is not stable. The operations on the heap structure can change the relative order of equal elements.
  complexity: 2
  source: https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/
- id: algo_004
  topic: algorithms
  tags:
  - searching
  - binary-search
  question: What is the recurrence relation for the time complexity of Binary Search?
  truth: T(n) = T(n/2) + O(1), which solves to O(lg n) by the Master Theorem.
  complexity: 1
  source: https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/
- id: algo_005
  topic: algorithms
  tags:
  - graphs
  - shortest-path
  - dijkstra
  question: Why does Dijkstra's algorithm fail on graphs with negative edge weights?
  truth: Dijkstra's greedy approach assumes that once a node is visited and its shortest path is determined, it can't be improved. Negative edges can violate this by offering a cheaper path through a previously settled node.
  complexity: 3
  source: https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/
- id: algo_006
  topic: algorithms
  tags:
  - graphs
  - mst
  - kruskal
  question: What data structure is efficiently used to implement Kruskal's algorithm for finding a Minimum Spanning Tree?
  truth: The Disjoint Set Union (DSU) or Union-Find data structure is used to keep track of connected components and detect cycles.
  complexity: 3
  source: https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/
- id: algo_007
  topic: algorithms
  tags:
  - dynamic-programming
  - knapsack
  question: What is the time complexity of the 0/1 Knapsack problem using dynamic programming with n items and capacity W?
  truth: O(nW). This is pseudo-polynomial time because it depends on the magnitude of W, not just the size of the input.
  complexity: 3
  source: https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/
