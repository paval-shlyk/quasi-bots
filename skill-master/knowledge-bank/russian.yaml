  topic: russian
  tags:
  - grammar
  - plural
  question: Множественное число слова 'дно'?
  truth: Множественное число слова 'дно' — 'донья'. Родительный падеж — 'доньев'.
  complexity: 3
  source: http://gramota.ru/slovari/dic/?word=%D0%B4%D0%BD%D0%BE&all=x
- id: ru_025
  topic: russian
  tags:
  - grammar
  - prepositions
  question: Оплатить за проезд или оплатить проезд?
  truth: 'Глагол ''оплатить'' переходный, требует винительного падежа без предлога: ''оплатить проезд''. ''Заплатить'' требует предлога ''за'': ''заплатить за проезд''.'
  complexity: 1
  source: http://gramota.ru/spravka/trudnosti?layout=spread&let=%25EE&id=36_86
- id: ru_026
  topic: russian
  tags:
  - grammar
  - adjective
  question: Что такое краткое прилагательное?
  truth: 'Краткое прилагательное — это форма качественного прилагательного, которая отвечает на вопросы ''каков? какова? каково? каковы?'' и в предложении обычно выступает в роли сказуемого. Например: он весел, она красива. Не изменяется по падежам, только по родам и числам.'
  complexity: 2
  source: https://therules.ru/endings-1/
- id: ru_027
  topic: russian
  tags:
  - orthography
  - endings
  question: Какое окончание в слове 'в постел...' (П.п.)?
  truth: Существительное 'постель' относится к 3-му склонению (женский род, оканчивается на ь). В предложном падеже (о ком? о чем? - в постели) существительные 3-го склонения имеют окончание 'и'.
  complexity: 2
  source: https://therules.ru/endings-2/
- id: ru_028
  topic: russian
  tags:
  - orthography
  - roots
  question: Как проверить безударную гласную в корне?
  truth: 'Чтобы проверить безударную гласную в корне слова, нужно изменить слово или подобрать однокоренное так, чтобы эта гласная оказалась под ударением. Пример: гора — гОры, вода — вОды.'
  complexity: 1
  source: http://gramota.ru/class/coach/tbgramota/45_62
