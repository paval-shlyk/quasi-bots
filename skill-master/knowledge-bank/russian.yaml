  question: Что такое причастный оборот?
  truth: Причастный оборот — это причастие с зависимыми словами. Если причастный оборот стоит после определяемого слова, он выделяется запятыми. Если перед — обычно не выделяется.
  complexity: 2
  source: https://therules.ru/comma-18/
- id: ru_045
  topic: russian
  tags:
  - orthography
  - prepositions
  question: Как пишется 'ввиду' (в значении 'из-за')?
  truth: 'Слитно. Предлог ''ввиду'' (из-за, по причине) пишется слитно. Пример: ввиду дождей. Раздельно пишется сочетание ''в виду'' (в значении ''в поле зрения'' или в выражении ''иметь в виду'').'
  complexity: 2
  source: http://gramota.ru/spravka/trudnosti?layout=spread&let=%25E2&id=36_18
- id: ru_046
  topic: russian
  tags:
  - grammar
  - gender
  question: Какого рода аббревиатура МГУ?
  truth: Род аббревиатуры обычно определяется по главному слову расшифровки. МГУ — Московский государственный университет. Университет — мужской род. Значит, МГУ принял студентов (м.р.).
  complexity: 2
  source: http://gramota.ru/spravka/letters?rub=rubric_90
- id: ru_047
  topic: russian
  tags:
  - grammar
  - spelling
  question: 'Как правильно: ''экстремальный'' или ''экстримальный''?'
  truth: 'Правильно: ''экстремальный''. Проверочное слово не ''экстрим'' (это позднее заимствование), а латинское extremus (крайний).'
  complexity: 1
  source: http://gramota.ru/slovari/dic/?word=%D1%8D%D0%BA%D1%81%D1%82%D1%80%D0%B5%D0%BC%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D0%B9&all=x
- id: ru_048
  topic: russian
  tags:
  - orthography
  - uppercase
  question: Как пишутся названия праздников (например, Новый год)?
  truth: 'В названиях праздников с прописной буквы пишется первое слово: Новый год, День учителя, День знаний. Если в название входят имена собственные, они тоже пишутся с прописной (День Святого Патрика). Исключение: День Победы (оба слова с прописной в знак особого уважения).'
  complexity: 2
  source: http://gramota.ru/spravka/letters?rub=rubric_83
