  topic: russian
  tags:
  - grammar
  - verbs
  question: Глаголы какого спряжения имеют окончания -ешь, -ет, -ем, -ете?
  truth: Это окончания глаголов I спряжения.
  complexity: 2
  source: https://therules.ru/vowels-8/
- id: ru_030
  topic: russian
  tags:
  - grammar
  - verbs
  question: Глаголы какого спряжения имеют окончания -ишь, -ит, -им, -ите?
  truth: Это окончания глаголов II спряжения.
  complexity: 2
  source: https://therules.ru/vowels-8/
