- id: ru_042
  topic: russian
  tags:
  - grammar
  - case
  question: Скучать по (вас/вам)?
  truth: 'Старая норма требовала предложного падежа с местоимениями 1 и 2 лица мн.ч.: скучать по нас, по вас. Современная норма допускает дательный падеж: скучать по нам, по вам. Но вариант ''по вас'' все еще считается предпочтительным в строгой речи.'
  complexity: 3
  source: http://gramota.ru/slovari/dic/?word=%D1%81%D0%BA%D1%83%D1%87%D0%B0%D1%82%D1%8C&all=x
- id: ru_043
  topic: russian
  tags:
  - orthography
  - hard_sign
  question: Когда пишется разделительный твердый знак (ъ)?
  truth: Твердый знак пишется перед буквами е, ё, ю, я только после приставок, оканчивающихся на согласную (подъезд, объявление), а также в иноязычных словах после приставок аб-, ад-, диз-, ин-, интер-, кон-, контр-, об-, суб-, транс- (адъютант, инъекция) и в сложных словах с первой частью двух-, трех-, четырех- (трехъязычный).
  complexity: 2
  source: https://therules.ru/vowels-1/
