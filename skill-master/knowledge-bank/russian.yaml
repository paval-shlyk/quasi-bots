  topic: russian
  tags:
  - orthography
  - b_sign
  question: Нужен ли мягкий знак в слове 'мышь'?
  truth: 'Да, нужен. Существительные женского рода с шипящим на конце пишутся с мягким знаком (3-е склонение): мышь, рожь, дочь, тишь.'
  complexity: 1
  source: http://gramota.ru/class/coach/tbgramota/45_75
- id: ru_032
  topic: russian
  tags:
  - orthography
  - b_sign
  question: Нужен ли мягкий знак в слове 'врач'?
  truth: 'Нет. Существительные мужского рода с шипящим на конце (2-е склонение) пишутся без мягкого знака: врач, грач, гараж, шалаш.'
  complexity: 1
  source: http://gramota.ru/class/coach/tbgramota/45_75
- id: ru_033
  topic: russian
  tags:
  - grammar
  - stress
  question: Где ударение в слове 'красивее'?
  truth: 'Ударение на ''и'' во втором слоге: красИвее.'
  complexity: 1
  source: http://gramota.ru/spravka/trudnosti?layout=spread&let=%25EA&id=36_50
- id: ru_034
  topic: russian
  tags:
  - orthography
  - hyphen
  question: Как пишется 'кое-как'?
  truth: Через дефис. Частица 'кое-' (кой-) пишется через дефис (кое-кто, кое-как), если не отделена от местоимения предлогом (кое у кого).
  complexity: 2
  source: https://therules.ru/hyphen-particles/
- id: ru_035
  topic: russian
  tags:
  - orthography
  - hyphen
  question: Как пишется 'кто-нибудь'?
  truth: Через дефис. Частицы '-то', '-либо', '-нибудь' пишутся через дефис.
  complexity: 1
  source: https://therules.ru/hyphen-particles/
- id: ru_036
  topic: russian
  tags:
  - lexicography
  - paronyms
  question: В чем разница между 'надеть' и 'одеть'?
  truth: '''Надеть'' — что-то на кого-то/что-то (надеть пальто, надеть очки, надеть чехол). ''Одеть'' — кого-то (одеть ребенка, одеть куклу). Мнемоническая фраза: ''Одеть Надежду, надеть одежду''.'
  complexity: 1
  source: http://gramota.ru/spravka/trudnosti?layout=spread&let=%25EE&id=36_83
