  topic: russian
  tags:
  - orthography
  - root
  question: 'Как правильно: ''растет'' или ''ростет''?'
  truth: 'Правильно ''растет''. В корнях -раст-/-ращ-/-рос- перед ''ст'' и ''щ'' пишется ''а'', перед ''с'' без последующего ''т'' — ''о''. Исключения: росток, ростовщик, Ростов, Ростислав, отрасль.'
  complexity: 2
