  - imperative
  question: Повелительное наклонение от глагола 'ехать'?
  truth: Литературная форма повелительного наклонения — 'поезжай' (или 'езжай' в разговорной речи, но лучше 'поезжай'). Формы 'едь', 'ехай' являются грубым просторечием.
  complexity: 1
  source: http://gramota.ru/spravka/trudnosti?layout=spread&let=%25E5&id=36_28
