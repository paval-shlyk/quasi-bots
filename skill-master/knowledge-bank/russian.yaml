  - colon
  question: Когда ставится двоеточие в бессоюзном сложном предложении?
  truth: Двоеточие ставится, если вторая часть раскрывает содержание первой (можно вставить 'а именно'), указывает на причину (можно вставить 'потому что') или дополняет первую часть (можно вставить 'что').
  complexity: 3
  source: https://therules.ru/colon/
