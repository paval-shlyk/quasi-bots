- id: ru_001
  topic: russian
  tags:
  - grammar
  - verb
  question: 'Как правильно: ''покласть'' или ''положить''?'
  truth: 'Правильно: ''положить''. Глагол ''покласть'' является просторечным. Глагол ''класть'' употребляется без приставки (несовершенный вид), а ''положить'' — только с приставкой (совершенный вид).'
  complexity: 1
  source: http://gramota.ru/spravka/trudnosti?layout=spread&let=%25EF&id=36_114
- id: ru_002
  topic: russian
  tags:
  - orthography
  - tsya-tsya
  question: Когда пишется 'тся', а когда 'ться' в глаголах?
  truth: Если глагол отвечает на вопрос 'что делает?' или 'что сделает?' (3-е лицо), то пишется 'тся' без мягкого знака. Если глагол отвечает на вопрос 'что делать?' или 'что сделать?' (инфинитив), то пишется 'ться' с мягким знаком.
  complexity: 1
  source: http://gramota.ru/uchebnik
- id: ru_003
  topic: russian
  tags:
  - grammar
  - noun
  question: Какого рода слово 'кофе'?
  truth: В строгой литературной норме слово 'кофе' мужского рода. Однако в разговорной речи допустимо использование среднего рода (черное кофе), что зафиксировано в некоторых современных словарях, но для официальной речи рекомендуется мужской род.
  complexity: 1
  source: http://gramota.ru/spravka/trudnosti?layout=spread&let=%25EA&id=36_45
- id: ru_004
  topic: russian
  tags:
  - orthography
  - prepositions
  question: 'Как пишется предлог ''в течение'': слитно или раздельно, с ''е'' или ''и'' на конце?'
  truth: 'Производный предлог ''в течение'' (в значении времени: в течение часа, в течение года) пишется раздельно и с буквой ''е'' на конце. Не путать с сочетанием предлога и существительного ''в течении'' (реки), где окончание зависит от падежа.'
  complexity: 2
  source: http://gramota.ru/spravka/trudnosti?layout=spread&let=%25E2&id=36_25
- id: ru_005
  topic: russian
  tags:
  - grammar
  - plural
  question: 'Как правильно во множественном числе: ''договоры'' или ''договора''?'
  truth: 'В строгой литературной норме правильно: ''договОры''. Форма ''договорА'' допустима в профессиональной и разговорной речи, но не рекомендуется для официального употребления.'
  complexity: 1
  source: http://gramota.ru/spravka/trudnosti?layout=spread&let=%25E4&id=36_19
- id: ru_006
  topic: russian
  tags:
  - orthography
  - prefixes
  question: Когда после приставки пишется 'ы', а когда 'и' (например, предыстория)?
  truth: 'После русских приставок, оканчивающихся на согласную, вместо ''и'' пишется ''ы'' (предыстория, безымянный, разыскать). Исключения: приставки меж- и сверх- (межинститутский, сверхизысканный), а также слово ''взимать''. После иноязычных приставок (дез-, контр-, пан- и др.) пишется ''и''.'
  complexity: 2
  source: https://therules.ru/vowels-2/
- id: ru_007
  topic: russian
  tags:
  - punctuation
  - introductory_words
  question: Выделяется ли слово 'однако' запятыми?
  truth: Если 'однако' стоит в начале предложения и является противительным союзом (равно по значению 'но'), то запятая после него не ставится. Если 'однако' стоит в середине или конце предложения и является вводным словом (можно убрать без потери смысла), то оно выделяется запятыми.
  complexity: 2
  source: http://gramota.ru/spravka/punctum/punctum_attach1/
- id: ru_008
  topic: russian
  tags:
  - grammar
  - numerals
  question: 'Как правильно: ''двое девушек'' или ''две девушки''?'
  truth: 'Правильно: ''две девушки''. Собирательные числительные (двое, трое) не употребляются с существительными женского рода (обозначающими лиц женского пола). Они сочетаются с лицами мужского пола, детенышами животных и существительными ''парного'' типа (ножницы, брюки).'
  complexity: 2
  source: http://gramota.ru/spravka/letters?rub=rubric_92
- id: ru_009
  topic: russian
  tags:
  - orthography
  - negation
  question: Как пишется 'не' с глаголами?
  truth: '''Не'' с глаголами пишется раздельно, кроме тех случаев, когда слово без ''не'' не употребляется (ненавидеть, негодовать) или если глагол образован с приставкой ''недо-'' в значении неполноты действия (недоедать).'
  complexity: 1
  source: https://therules.ru/hyphen-particles/
- id: ru_010
  topic: russian
  tags:
  - grammar
  - comparative
  question: Можно ли сказать 'более лучше'?
  truth: Нет, это грамматическая ошибка. Сравнительная степень прилагательного образуется либо с помощью суффикса (лучше, красивее), либо с помощью слов 'более/менее' и начальной формы (более хороший, более красивый). Сочетание обоих способов недопустимо.
  complexity: 1
  source: http://gramota.ru/spravka/trudnosti?layout=spread&let=%25EB&id=36_52
- id: ru_011
  topic: russian
  tags:
  - orthography
  - n-nn
  question: Сколько 'н' пишется в слове 'жареный'?
  truth: В слове 'жареный' (отглагольное прилагательное) пишется одна 'н', если нет зависимых слов и приставок (кроме 'не-'). Если есть зависимые слова ('жаренный на масле') или приставка ('пожаренный'), то пишется две 'н' (причастие).
  complexity: 2
  source: https://therules.ru/double-consonants/
- id: ru_012
  topic: russian
  tags:
  - grammar
  - stress
  question: Где ставится ударение в слове 'звонит'?
  truth: 'Ударение падает на окончание: звонИт, звонИшь, звонЯт. Ударение на корень (звОнит) является грубой ошибкой.'
  complexity: 1
  source: http://gramota.ru/spravka/trudnosti?layout=spread&let=%25E7&id=36_35
- id: ru_013
  topic: russian
  tags:
  - grammar
  - stress
  question: Где ставится ударение в слове 'торты'?
  truth: 'Ударение падает на первый слог: тОрты, тОртов. Не на окончание.'
  complexity: 1
  source: http://gramota.ru/slovari/dic/?word=%D1%82%D0%BE%D1%80%D1%82&all=x
- id: ru_014
  topic: russian
  tags:
  - punctuation
  - address
  question: Как выделяется обращение на письме?
  truth: Обращение всегда выделяется запятыми. Если обращение стоит в начале предложения, запятая ставится после него. Если в середине — с двух сторон. Если в конце — перед ним. Если обращение произносится с восклицательной интонацией, после него ставится восклицательный знак.
  complexity: 1
  source: https://therules.ru/comma-16/
- id: ru_015
  topic: russian
  tags:
  - orthography
  - hyphen
  question: Как пишется слово 'пол-Москвы'?
  truth: 'Пишется через дефис: ''пол-Москвы''. Корень ''пол-'' пишется через дефис, если вторая часть слова начинается с прописной буквы, гласной буквы (пол-яблока) или буквы ''л'' (пол-лимона). В остальных случаях — слитно (полдома).'
  complexity: 2
  source: http://gramota.ru/class/coach/tbgramota/45_88
- id: ru_016
  topic: russian
  tags:
  - grammar
  - case
  question: Согласно (чего/чему)?
  truth: 'Предлог ''согласно'' требует дательного падежа: согласно (чему?) приказу, расписанию, уставу. Употребление родительного падежа (согласно приказа) характерно для официально-делового стиля прошлого, но сейчас считается ошибкой.'
  complexity: 2
  source: http://gramota.ru/spravka/trudnosti?layout=spread&let=%25F1&id=36_77
- id: ru_017
  topic: russian
  tags:
  - orthography
  - capitalization
  question: Как писать 'Вы' в личном письме?
  truth: Местоимение 'Вы' пишется с прописной буквы при обращении к одному лицу в официальных документах и личных письмах как форма вежливости. При обращении к нескольким лицам или в неофициальной переписке (в интернете, смс) обычно пишется со строчной буквы 'вы', хотя прописная не запрещена.
  complexity: 1
  source: http://gramota.ru/spravka/letters?rub=rubric_88
- id: ru_018
  topic: russian
  tags:
  - grammar
  - gender
  question: Какого рода слово 'тюль'?
  truth: 'Слово ''тюль'' мужского рода (как рояль, пароль). Правильно: красивый тюль, белым тюлем.'
  complexity: 2
  source: http://gramota.ru/spravka/trudnosti?layout=spread&let=%25F2&id=36_117
- id: ru_019
  topic: russian
  tags:
  - grammar
  - verb
  question: Существует ли слово 'придти'?
  truth: В современном русском языке правильная форма инфинитива — 'прийти'. Форма 'придти' считается устаревшей и в настоящее время не является нормативной.
  complexity: 1
  source: http://gramota.ru/spravka/trudnosti?layout=spread&let=%25EF&id=36_118
- id: ru_020
  topic: russian
  tags:
  - punctuation
  - direct_speech
  question: Какие знаки препинания ставятся при прямой речи перед словами автора?
  truth: 'Если прямая речь стоит перед словами автора, она заключается в кавычки, после нее ставится запятая (или вопросительный/восклицательный знак), а слова автора начинаются с тире и со строчной буквы. Пример: "Я приду", — сказал он.'
  complexity: 2
  source: https://therules.ru/direct-speech/
- id: ru_021
  topic: russian
  tags:
  - grammar
  - participle
  question: 'В чем ошибка фразы: ''Подъезжая к сией станции, у меня слетела шляпа''?'
  truth: 'Ошибка в употреблении деепричастного оборота. Деепричастие (подъезжая) должно обозначать добавочное действие того же лица (подлежащего), которое совершает основное действие. Здесь подлежащее ''шляпа'', она не могла подъезжать. Правильно: ''Когда я подъезжал к станции, у меня слетела шляпа''.'
  complexity: 2
  source: http://gramota.ru/spravka/trudnosti?layout=spread&let=%25E4&id=36_15
- id: ru_022
  topic: russian
  tags:
  - orthography
  - adverbs
  question: Как пишется 'вряд ли'?
  truth: Частица 'ли' (ль) пишется раздельно со словами. Поэтому 'вряд ли' пишется раздельно в два слова.
  complexity: 2
  source: http://gramota.ru/spravka/trudnosti?layout=spread&let=%25E2&id=36_24
- id: ru_023
  topic: russian
  tags:
  - grammar
  - stress
  question: Где ударение в слове 'баловать'?
  truth: 'Ударение падает на последний слог: баловАть, баловАю, балУю. Не бАловать.'
  complexity: 2
  source: http://gramota.ru/spravka/trudnosti?layout=spread&let=%25E1&id=36_4
