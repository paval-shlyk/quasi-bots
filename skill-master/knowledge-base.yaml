  topic: "math"
  tags: ["linear-algebra", "vectors", "transformation", "matrices"]
  question: "Intuitive explanation of Eigenvalues and Eigenvectors."
  truth: "An Eigenvector is a vector that does not change direction during a linear transformation (it only scales). The Eigenvalue is the factor by which it scales (stretches or shrinks)."
  complexity: 0

- id: "math_002"
