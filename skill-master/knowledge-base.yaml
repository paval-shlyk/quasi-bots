# --- Algorithms ---
- id: "algo_001"
  topic: "algorithms"
  tags: ["sorting", "complexity", "worst-case", "performance"]
  question: "Explain the worst-case time complexity of QuickSort and when it occurs."
  truth: "O(n²). This occurs when the pivot selection is poor, such as consistently picking the smallest or largest element in an already sorted (or reverse sorted) array, causing unbalanced partitions (n-1 and 0)."
  complexity: 0

- id: "algo_002"
  topic: "algorithms"
  tags: ["graph", "tree", "memory", "optimization", "search"]
  question: "What is the primary difference in memory usage between Depth-First Search (DFS) and Breadth-First Search (BFS) on a balanced tree?"
  truth: "DFS is generally more memory efficient for wide trees as it only stores the current path (height O(h)). BFS stores the entire frontier level (width), which can be exponential O(2^h) in the worst case."
  complexity: 0

# --- Crypto ---
- id: "crypto_001"
  topic: "crypto"
  tags: ["security", "hashing", "passwords", "attacks"]
  question: "What is the purpose of a 'Salt' in password hashing?"
  truth: "A Salt is random data added to a password before hashing. It prevents Rainbow Table attacks (precomputed hash lookups) and ensures that two users with the same password have different hashes."
  complexity: 0

- id: "crypto_002"
  topic: "crypto"
  tags: ["encryption", "keys", "rsa", "aes", "pki"]
  question: "Explain the difference between Symmetric and Asymmetric encryption."
  truth: "Symmetric uses the same key for encryption and decryption (fast, e.g., AES). Asymmetric uses a public key for encryption and a private key for decryption (slower, enables secure key exchange, e.g., RSA, ECC)."
  complexity: 0

# --- Embedded ---
- id: "embedded_001"
  topic: "embedded"
  tags: ["c", "compiler", "memory-mapped-io", "isr", "optimization"]
  question: "Why is the 'volatile' keyword critical in embedded C/C++ programming?"
  truth: "It tells the compiler NOT to optimize reads/writes to a variable. This is essential for Memory-Mapped I/O (hardware registers) or variables modified by an Interrupt Service Routine (ISR), which can change outside the main program flow."
  complexity: 0

- id: "embedded_002"
  topic: "embedded"
  tags: ["rtos", "scheduling", "mutex", "deadlock", "concurrency"]
  question: "What is 'Priority Inversion' in an RTOS?"
  truth: "A scenario where a high-priority task is forced to wait for a low-priority task because the low-priority task holds a shared resource (mutex), and a medium-priority task preempts the low-priority task. Solved via Priority Inheritance."
  complexity: 0

# --- Linux Kernel ---
- id: "linux_001"
  topic: "linux-kernel"
  tags: ["memory-management", "allocation", "physical-memory", "kernel-api"]
  question: "What is the difference between 'kmalloc' and 'vmalloc'?"
  truth: "kmalloc allocates physically contiguous memory (better performance, limited size). vmalloc allocates virtually contiguous but physically fragmented memory (slower due to page table overhead, allows larger allocations)."
  complexity: 0

- id: "linux_002"
  topic: "linux-kernel"
  tags: ["scheduling", "process-management", "cfs", "red-black-tree"]
  question: "Explain the role of the 'scheduler' (CFS - Completely Fair Scheduler)."
  truth: "The CFS aims to maximize CPU utilization and interactive performance by modeling an 'ideal, precise multi-tasking CPU'. It uses a red-black tree to track 'vruntime' (virtual runtime) and picks the task with the smallest vruntime to run next."
  complexity: 0

