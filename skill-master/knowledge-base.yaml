  question: "What does the Derivative represent in a physical context?"
  truth: "The derivative represents the instantaneous rate of change of a quantity. Geometrically, it is the slope of the tangent line to the function's curve at a specific point."
  complexity: 0

# --- Networking ---
- id: "net_001"
  topic: "networking"
  tags: ["tcp", "connection", "reliability", "handshake"]
  question: "Describe the TCP 3-Way Handshake."
  truth: "1. SYN: Client sends segment with SYN flag. 2. SYN-ACK: Server responds with SYN and ACK flags. 3. ACK: Client sends ACK flag. Connection is now established."
  complexity: 0

- id: "net_002"
  topic: "networking"
  tags: ["osi-model", "ip", "transport", "architecture"]
  question: "Difference between Layer 3 (Network) and Layer 4 (Transport) in OSI."
  truth: "Layer 3 (IP) handles logical addressing and routing packets between networks. Layer 4 (TCP/UDP) handles end-to-end reliability, flow control, and multiplexing via ports."
  complexity: 0

# --- Rust ---
- id: "rust_001"
  topic: "rust"
  tags: ["concurrency", "traits", "safety", "threads"]
  question: "What is the difference between the 'Send' and 'Sync' traits?"
  truth: "Send allows a type to be transferred ownership between threads. Sync allows a type to be referenced (&T) safely from multiple threads. (T is Sync if &T is Send)."
  complexity: 0

- id: "rust_002"
  topic: "rust"
  tags:
    ["borrow-checker", "interior-mutability", "refcell", "mutex", "patterns"]
  question: "Explain the 'Interior Mutability' pattern (RefCell / Mutex)."
  truth: "It allows mutating data even when you only have an immutable reference to the container. It moves borrow checking from compile-time to runtime (panicking on violation for RefCell, blocking for Mutex)."
  complexity: 0

# --- System Design ---
- id: "sys_001"
  topic: "system-design"
  tags: ["distributed-systems", "consistency", "availability", "cap-theorem"]
  question: "Explain the CAP Theorem constraints."
  truth: "In a distributed data store, you can only guarantee two of three: Consistency (every read receives the most recent write), Availability (every request receives a response), Partition Tolerance (system continues despite network drops). P is mandatory, so you choose CP or AP."
  complexity: 0

- id: "sys_002"
  topic: "system-design"
  tags: ["scalability", "sharding", "distributed-systems", "hashing"]
  question: "What is Consistent Hashing and why use it?"
  truth: "A hashing technique where the hash space is a ring. When adding/removing a node (server), only K/N keys need to be remapped (where K=keys, N=nodes), rather than remapping ALL keys as in 'hash % N'. Critical for horizontal scaling."
  complexity: 0

# --- Windows Kernel ---
- id: "win_001"
  topic: "windows-kernel"
  tags: ["interrupts", "scheduling", "memory-safety", "irql"]
  question: "What is IRQL (Interrupt Request Level)?"
  truth: "The hardware priority level at which the processor operates. Threads run at PASSIVE_LEVEL. Hardware interrupts raise IRQL. Code running at high IRQL (DISPATCH_LEVEL or higher) cannot access pageable memory to avoid page faults."
  complexity: 0

- id: "win_002"
  topic: "windows-kernel"
  tags: ["process-management", "internals", "structures", "eprocess"]
  question: "What is the difference between EPROCESS and KPROCESS structures?"
  truth: "EPROCESS (Executive Process) contains accounting info, handle tables, and is opaque. KPROCESS (Kernel Process) contains scheduling data (threads, priority) and is the first field of EPROCESS. The Kernel uses KPROCESS; the Executive/Drivers use EPROCESS."
  complexity: 0

# --- Physics ---
- id: "phys_001"
  topic: "physics"
  tags: ["thermodynamics", "entropy", "time", "fundamental-laws"]
  question: "State the Second Law of Thermodynamics regarding Entropy."
  truth: "In an isolated system, the total entropy (disorder) can never decrease over time. It stays constant in reversible processes and increases in irreversible ones."
  complexity: 0

- id: "phys_002"
  topic: "physics"
  tags: ["quantum-mechanics", "precision", "particles", "uncertainty"]
  question: "Explain the Heisenberg Uncertainty Principle."
  truth: "It is impossible to measure both the position and momentum of a quantum particle with arbitrary precision simultaneously. The more precisely one is known, the less precisely the other can be known."
  complexity: 0
